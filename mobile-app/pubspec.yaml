name: dropme_mobile
description: "DropMe - Ride Hailing Application Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  get: ^4.6.5
  
  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.3.0
  
  # Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.3
  
  # UI & Navigation
  google_maps_flutter: ^2.5.0
  geolocator: ^9.0.2
  geocoding: ^2.1.0
  
  # Authentication
  firebase_auth: ^4.10.0
  google_sign_in: ^6.1.4
  
  # Notifications
  firebase_messaging: ^14.6.0
  
  # DateTime
  intl: ^0.18.1
  
  # Image Picker
  image_picker: ^1.0.4
  
  # Payment
  razorpay_flutter: ^1.3.7
  
  # Others
  cupertino_icons: ^1.0.2
  fluttertoast: ^8.2.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
