version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dropme_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-dropme_db}
      POSTGRES_USER: ${DB_USER:-dropme_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dropme_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - dropme_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dropme_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dropme_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-dropme_user}
      DB_PASSWORD: ${DB_PASSWORD:-dropme_password}
      DB_NAME: ${DB_NAME:-dropme_db}
      JWT_SECRET: ${JWT_SECRET:-your_secret_key}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - dropme_network
    command: npm run start:dev

  admin_dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: dropme_admin
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3000/api
    depends_on:
      - backend
    networks:
      - dropme_network

volumes:
  postgres_data:

networks:
  dropme_network:
    driver: bridge
